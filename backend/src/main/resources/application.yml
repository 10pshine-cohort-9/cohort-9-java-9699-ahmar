spring:
  application:
    name: contact-manager
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
    expiration-hours: 24
logging:
  level:
    com.tenpshine.contacts: INFO
